<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020202">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>운동 기록</title>
<style>
/* 시각 방향(검정 바탕, 라임 포인트, 링·글로우 차트)은 21st.dev의 "Fitness Bento Grid"(abushaidislam7)와
   "Activity Card"(kokonutd)를 참고해 바닐라 CSS로 옮겼다. */
:root {
  color-scheme: dark light;
  --bg: #020202; --card: #121212; --surface: #1c1c1e; --line: rgba(255, 255, 255, .08);
  --text: #f5f5f5; --muted: #8e8e93; --accent: #9af500; --accent-bg: #9af500; --ink: #0a0a0a; --pink: #f62064;
}
@media (prefers-color-scheme: light) {
  :root { --bg: #f5f6f7; --card: #fff; --surface: #eef0f2; --line: #e2e5e9; --text: #0a0a0a; --muted: #5b6472; --accent: #3f6212; --accent-bg: #84cc16; }
}
* { box-sizing: border-box; }
body {
  margin: 0 auto; max-width: 560px; padding: 14px 14px calc(160px + env(safe-area-inset-bottom));
  background: var(--bg); color: var(--text); -webkit-tap-highlight-color: transparent;
  font: 16px/1.45 system-ui, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
h1 { font-size: 28px; font-weight: 800; letter-spacing: -.03em; margin: 10px 0 2px; }
h3 { font-size: 16px; margin: 0; letter-spacing: -.01em; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.muted { color: var(--muted); font-size: 13px; margin: 4px 0 0; }
.cap { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.card { display: block; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-top: 12px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid2 > .card { margin-top: 12px; }
.between { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.pill { border-radius: 999px; border: 1px solid var(--line); background: var(--surface); padding: 0 14px; min-height: 40px; font-size: 13px; font-weight: 700; }
.pill[aria-pressed=true], .primary { background: var(--accent-bg); color: var(--ink); border-color: transparent; }
.primary { border-radius: 999px; min-height: 48px; padding: 0 20px; font-weight: 800; border: 0; }
.tag { display: inline-block; white-space: nowrap; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); padding: 4px 10px; font-size: 11px; font-weight: 700; }
.up { color: var(--ink); background: var(--accent-bg); border-radius: 999px; padding: 1px 8px; font-size: 11px; font-weight: 800; }

.hero { display: flex; justify-content: space-between; align-items: center; background: linear-gradient(180deg, var(--surface), var(--card)); margin-top: 0; }
.days { display: flex; gap: 8px; overflow-x: auto; padding: 12px 0 2px; scrollbar-width: none; }
.days .pill { flex: none; }
.feel { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; }
.feel .pill { padding: 0; min-height: 44px; }
.feel.sm .pill { min-height: 36px; font-size: 12px; font-weight: 600; }

input[type=number], select, textarea, input[type=date] { background: var(--surface); border: 1px solid transparent; border-radius: 12px; }
input[type=number] { width: 100%; padding: 12px 26px; text-align: center; font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; -moz-appearance: textfield; }
input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
input::placeholder { color: var(--muted); opacity: .65; font-weight: 500; }
input[type=date] { border-radius: 999px; padding: 8px 12px; font-size: 13px; font-weight: 700; min-height: 40px; }
input[type=checkbox] { width: 24px; height: 24px; accent-color: var(--accent-bg); flex: none; }
select, input[type=text], input[type=password] { width: 100%; min-height: 48px; padding: 0 12px; font-weight: 700; }
input[type=text], input[type=password] { background: var(--surface); border: 1px solid transparent; border-radius: 12px; }
textarea { width: 100%; min-height: 9.5em; padding: 10px 12px; margin-top: 8px; font-size: 14px; }
.field { position: relative; display: block; }
.field > span { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font-size: 11px; color: var(--muted); pointer-events: none; }
.stat { display: flex; flex-direction: column; gap: 8px; }
.check { display: flex; gap: 12px; align-items: center; }

.set { display: grid; grid-template-columns: 22px 1fr 1fr 48px; gap: 8px; align-items: center; margin-top: 10px; }
.idx { color: var(--muted); font-weight: 700; font-size: 13px; text-align: center; }
.ok { width: 48px; height: 48px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--muted); display: grid; place-items: center; padding: 0; }
.ok svg { width: 22px; height: 22px; }
.set.done .ok { background: var(--accent-bg); color: var(--ink); border-color: transparent; }
.set.done input { border-color: color-mix(in srgb, var(--accent) 45%, transparent); }

.link { background: none; border: 0; padding: 0; font: inherit; color: inherit; text-align: left; text-decoration: underline dotted; text-underline-offset: 5px; }
dialog { width: min(520px, calc(100vw - 24px)); max-height: 86vh; overflow: auto; padding: 18px; border: 1px solid var(--line); border-radius: 20px; background: var(--card); color: var(--text); }
dialog::backdrop { background: rgba(0, 0, 0, .6); }
dialog h2 { font-size: 20px; margin: 0; letter-spacing: -.02em; }
dialog h3 { margin-top: 16px; }
dialog a { color: var(--accent); }
/* 동작 그림: 흰 바탕 위의 관절 인형. 쓰는 근육은 빨강, 돕는 근육은 연한 빨강 */
.figbox { margin-top: 12px; background: #fff; border-radius: 12px; overflow: hidden; }
.fig { display: block; width: 100%; }
.fig line { stroke-linecap: round; fill: none; }
.fig .ol { stroke: #6b6b76; fill: #6b6b76; }
.fig .skin { stroke: #f1f1f4; fill: #f1f1f4; }
.fig .far { stroke: #d5d5dc; }
.fig .olp { fill: #6b6b76; stroke: #6b6b76; stroke-width: 10.4; stroke-linejoin: round; }
.fig .skinp { fill: #f1f1f4; stroke: #f1f1f4; stroke-width: 8; stroke-linejoin: round; }
.fig .mu.on, .sw { stroke: #e5383b; fill: #e5383b; background: #e5383b; }
.fig .mu.half, .sw.half { stroke: #f4a9ab; fill: #f4a9ab; background: #f4a9ab; }
.fig .pad { stroke: #3d3d48; fill: #3d3d48; }
.fig .bar { stroke: #a3a3ae; fill: #a3a3ae; }
.fig .cab { stroke: #55555f; }
.fig .floor { stroke: #dedee4; }
.sw { display: inline-block; width: 10px; height: 10px; margin-right: 6px; border-radius: 3px; }
dialog a.primary { display: inline-flex; align-items: center; margin-top: 12px; color: var(--ink); text-decoration: none; }
svg.icon { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ring { width: 78px; height: 78px; display: block; }
.ring circle { fill: none; stroke-width: 6.5; }
.ring .track { stroke: color-mix(in srgb, var(--accent) 16%, transparent); }
.ring .prog { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .4s; }
.ring text { fill: var(--text); font-size: 13px; font-weight: 800; }

.num { font-size: 32px; font-weight: 800; letter-spacing: -.03em; font-variant-numeric: tabular-nums; margin-top: 6px; }
.num small { font-size: 14px; color: var(--muted); font-weight: 700; margin-left: 2px; }
.delta { font-size: 13px; color: var(--accent); margin-left: 6px; letter-spacing: 0; }
.chart { width: 100%; height: auto; display: block; margin-top: 8px; overflow: visible; }
.chart path { fill: none; stroke: var(--accent); stroke-linecap: round; stroke-linejoin: round; }
.chart .line { stroke-width: 2.2; }
.chart .glow { stroke-width: 5; opacity: .35; filter: blur(4px); }
.chart .dot { fill: var(--accent); }
.chart .halo { fill: var(--accent); opacity: .22; }
.chart .goal { stroke: var(--pink); stroke-width: 1; stroke-dasharray: 4 4; }
.axis { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
.meter { height: 8px; border-radius: 999px; background: var(--surface); margin-top: 12px; overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 999px; background: var(--accent-bg); }
.bars { display: flex; gap: 8px; align-items: flex-end; height: 96px; margin-top: 12px; }
.bars i { flex: 1; min-height: 4px; border-radius: 6px 6px 3px 3px; opacity: .5; background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 70%, transparent), color-mix(in srgb, var(--accent) 16%, transparent)); }
.bars i.now { opacity: 1; background: linear-gradient(180deg, var(--accent-bg), color-mix(in srgb, var(--accent) 35%, transparent)); }
ol.plan { list-style: none; margin: 10px 0 8px; padding: 0; font-size: 13px; color: var(--muted); }
ol.plan li { padding: 7px 10px; border-radius: 10px; }
ol.plan li.now { background: var(--surface); color: var(--text); box-shadow: inset 3px 0 0 var(--accent); }
ul.plain { margin: 8px 0 0; padding-left: 18px; font-size: 14px; }
ul.plain li { margin-top: 4px; }
details { border-top: 1px solid var(--line); padding: 12px 0; }
summary { font-weight: 700; min-height: 28px; cursor: pointer; }

#rest { position: fixed; left: 14px; right: 14px; max-width: 532px; margin: 0 auto; bottom: calc(80px + env(safe-area-inset-bottom)); display: flex; align-items: center; gap: 8px; padding: 10px 10px 12px 18px; background: var(--accent-bg); color: var(--ink); border-radius: 18px; overflow: hidden; box-shadow: 0 8px 30px rgba(0, 0, 0, .4); }
#rest[hidden] { display: none; }
#rest::after { content: ''; position: absolute; left: 0; bottom: 0; height: 4px; width: calc(var(--p, 1) * 100%); background: var(--ink); opacity: .35; transition: width .25s linear; }
#rest .cap { color: inherit; opacity: .7; }
#rest b { font-size: 26px; font-variant-numeric: tabular-nums; flex: 1; }
#rest button { border: 0; border-radius: 999px; background: rgba(0, 0, 0, .14); min-height: 40px; padding: 0 12px; font-weight: 700; font-size: 13px; }

nav { position: fixed; left: 0; right: 0; width: max-content; margin: 0 auto; bottom: calc(12px + env(safe-area-inset-bottom)); display: flex; gap: 4px; padding: 6px; background: color-mix(in srgb, var(--card) 86%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid var(--line); border-radius: 999px; }
nav button { display: flex; align-items: center; gap: 6px; border: 0; background: none; color: var(--muted); padding: 0 16px; min-height: 48px; border-radius: 999px; font-size: 13px; font-weight: 800; white-space: nowrap; }
nav button[aria-current=page] { background: var(--accent-bg); color: var(--ink); }
nav button:not([aria-current=page]) span { display: none; }
nav svg { width: 22px; height: 22px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main id="app"></main>
<dialog id="guide" aria-label="운동 안내"></dialog>
<div id="rest" hidden role="timer">
  <span class="cap">휴식</span><b id="restTime"></b>
  <button id="restSub" aria-label="30초 줄이기">−30</button><button id="restAdd" aria-label="30초 늘리기">+30</button><button id="restSkip">건너뛰기</button>
</div>
<nav aria-label="화면 이동">
  <button data-view="today" aria-label="오늘"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5v11M17.5 6.5v11M3 9.5v5M21 9.5v5M6.5 12h11"/></svg><span>오늘</span></button>
  <button data-view="progress" aria-label="진행"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17l5-6 4 3 8-9M15 5h5v5"/></svg><span>진행</span></button>
  <button data-view="history" aria-label="기록"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg><span>기록</span></button>
  <button data-view="settings" aria-label="설정"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg><span>설정</span></button>
</nav>
<script src="figure.js"></script>
<script>
const KEY = 'gymlog', ORDER = ['A', 'B', 'C', 'D', 'E', 'F'], STEP = 2.5, TARGET_BF = 13, WEEK_GOAL = 6;
const CARDIO = '마무리 유산소 15분 · 실내 자전거 또는 경사 걷기';
const ex = (n, sets = 3, lo = 8, hi = 12, rest) => ({ n, sets, lo, hi, ...(rest ? { rest } : {}) });
const big = n => ex(n, 3, 8, 12, 120), small = n => ex(n, 3, 10, 15); // 다관절은 휴식 120초, 고립은 설정의 기본 휴식
// 주 6회, 부위별 주 2회, 부위당 주 9~15세트. 관절 부담이 적은 쪽으로 골랐다:
// 등받이·가슴받이가 있어 척추를 위에서 누르지 않는 기구, 매달리지 않는 종목, 손목을 중립으로 잡는 그립,
// 허리를 굽히지 않는 코어 운동. 당기기는 무겁게 하지 않고 높은 횟수로 한다(횟수 범위가 넓어도 근비대는 비슷하다).
// 종목은 설정 탭에서 헬스장 기구에 맞게 바꾼다.
const DEFAULT_ROUTINE = {
  A: { name: '밀기 1', focus: '가슴 중심 · 어깨 · 삼두', ex: [big('체스트 프레스 머신'), small('펙덱 플라이'), small('덤벨 사이드 레터럴 레이즈'), small('오버헤드 케이블 익스텐션'), small('케이블 푸시다운')] },
  B: { name: '당기기 1', focus: '등 너비 · 이두', ex: [small('뉴트럴 그립 랫 풀다운'), small('풀오버 머신'), small('체스트 서포티드 로우 머신'), small('리버스 펙덱 플라이'), small('해머 컬')] },
  C: { name: '하체 1', focus: '대퇴사두 · 햄스트링 · 종아리', ex: [big('레그 프레스'), small('시티드 레그 컬'), small('레그 익스텐션'), small('레그 프레스 카프 레이즈'), small('팔로프 프레스')] },
  D: { name: '밀기 2', focus: '윗가슴 · 어깨 · 삼두', ex: [big('인클라인 체스트 프레스 머신'), small('케이블 사이드 레터럴 레이즈'), small('케이블 플라이'), small('케이블 푸시다운'), small('리버스 펙덱 플라이')] },
  E: { name: '당기기 2', focus: '등 두께 · 이두', ex: [small('체스트 서포티드 로우 머신'), small('뉴트럴 그립 랫 풀다운'), small('케이블 페이스 풀'), small('프리처 컬 머신'), small('해머 컬')] },
  F: { name: '하체 2', focus: '둔근 · 햄스트링 · 코어', ex: [big('힙 쓰러스트 머신'), small('싱글 레그 프레스'), small('시티드 레그 컬'), small('힙 어브덕션 머신'), small('데드버그')] },
};

// 3년(156주) 프로그램. 1년차는 감량, 이후는 근성장과 짧은 감량을 번갈아 한다. 종목은 유지하고 단계마다 세트 수와 횟수 범위, 식단 방향만 바꾼다. 무거운 저반복 구간은 두지 않는다.
// 근거: ACSM 2026 입장문(부위당 주 약 10세트, 복잡한 주기화는 필수 아님), Robinson 2024(실패에 가까울수록 근비대 유리),
// Singer 2024(세트 간 휴식 60초 초과), Coleman 2024(계획된 디로드는 근비대에 이점 없음), Murphy·Koehler 2022(결손 500kcal 이내).
const PHASES = [
  { name: '적응', cut: 1, weeks: 4, sets: 2, c: [10, 15], i: [12, 20], effort: '모든 세트를 3~4회 더 할 수 있을 때 멈춥니다. 자세와 기구 세팅을 익히는 기간입니다.', food: '유지 열량보다 하루 300~500kcal 적게 먹기 시작합니다.' },
  { name: '감량 1', cut: 1, weeks: 12, sets: 3, c: [8, 12], i: [10, 15], effort: '1~3회 남기고 멈춥니다. 고립 종목의 마지막 세트는 더 못 할 때까지 해도 됩니다.', food: '결손은 하루 500kcal 이내로 둡니다. 주당 체중의 0.5~0.7% 감량이 목표입니다.' },
  { name: '유지 1', weeks: 2, sets: 3, c: [8, 12], i: [10, 15], effort: '운동은 줄이지 않고 그대로 합니다.', food: '2주 동안 유지 열량으로 먹습니다. 체중이 멈추는 것이 정상입니다.' },
  { name: '감량 2', cut: 1, weeks: 12, sets: 3, c: [8, 12], i: [10, 15], effort: '1~3회 남기고 멈춥니다. 무게는 횟수 범위를 다 채운 뒤에만 올립니다.', food: '결손은 하루 500kcal 이내를 유지합니다. 근력이 2주 넘게 떨어지면 결손을 줄입니다.' },
  { name: '유지 2', weeks: 2, sets: 3, c: [8, 12], i: [10, 15], effort: '운동은 줄이지 않고 그대로 합니다.', food: '2주 동안 유지 열량으로 먹으며 감량한 체중을 굳힙니다.' },
  { name: '근성장 1', weeks: 20, sets: 3, lead: 1, c: [8, 12], i: [10, 15], effort: '각 루틴의 첫 두 종목은 4세트입니다. 0~2회 남기고 멈춥니다.', food: '유지 열량에서 5~10% 더 먹습니다. 체중은 한 달에 0.5~1kg 이내로만 늘립니다.' },
  { name: '근성장 2', weeks: 24, sets: 3, lead: 1, c: [8, 12], i: [10, 15], effort: '첫 두 종목은 4세트입니다. 0~2회 남기고 멈춥니다. 종목별 기록이 3개월 넘게 멈추면 먹는 양과 수면부터 점검합니다.', food: '유지 열량에서 5~10% 더 먹습니다. 체중은 한 달에 0.5kg 안팎으로만 늘립니다. 3주간 안 오르면 하루 100~150kcal를 더합니다.' },
  { name: '감량 3', cut: 1, weeks: 8, sets: 3, c: [8, 12], i: [10, 15], effort: '무게를 지키는 것이 목표입니다. 1~3회 남기고 멈춥니다.', food: '하루 300~500kcal 결손으로 8주만 뺍니다. 늘어난 지방만 걷어 내는 짧은 감량입니다.' },

// 이중 점진: 모든 세트가 최대 횟수에 닿으면 증량하고 최소 횟수부터, 아니면 같은 무게로 1회 더.
// 지난 회차의 느낌으로 조절한다: 가뿐함(1)은 더 빨리 올리고, 힘듦(3)은 그대로 반복, 무리함(4)은 무게를 10% 낮춘다.
function suggest(prev, e, feel = 2) {
  if (!prev) return null;
  const reached = n => prev.length >= e.sets && prev.every(([, r]) => r >= n);
  const mode = feel === 4 ? 'deload' : feel === 3 ? 'hold' : reached(feel === 1 ? e.hi - 1 : e.hi) ? 'up' : 'add';
  const sets = Array.from({ length: e.sets }, (_, i) => {
    const [kg, r] = prev[Math.min(i, prev.length - 1)];
    return mode === 'deload' ? [Math.round(kg * .9 / STEP) * STEP, r]
      : mode === 'hold' ? [kg, r]
      : mode === 'up' ? [kg + STEP, e.lo]
      : [kg, Math.min(r + (feel === 1 ? 2 : 1), e.hi)];
  });
  return { up: mode === 'up', mode, sets };
}

function parseRoutine(text) {

    return ex(n, Math.min(pos(s, 3), 10), lo, Math.max(lo, pos(hi, 12)), Math.min(pos(rest, 0), 600));
  });
}

function b64(str) {
  const u = new TextEncoder().encode(str);
  let out = '';
  for (let i = 0; i < u.length; i += 0x8000) out += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000));
  return btoa(out);
}

function phaseAt(week) {
  let end = 0;
  for (let i = 0; i < PHASES.length; i++) { end += PHASES[i].weeks; if (week <= end) return i; }
  return PHASES.length - 1; // 156주가 지나면 마지막 단계를 이어 간다
}

// 종목은 그대로 두고 세트와 횟수 범위만 단계에 맞춘다. 휴식 120초 이상인 종목을 다관절로 본다.
function applyPhase(routine, p) {
  const out = structuredClone(routine);
  for (const d of Object.values(out)) d.ex.forEach((e, i) => {
    const [lo, hi] = e.rest >= 120 ? p.c : p.i;
    Object.assign(e, { sets: p.sets + (i < 2 ? p.lead || 0 : 0), lo, hi });
  });
  return out;
}

const iso = d => d.toISOString().slice(0, 10);
function monday(dateStr) {
  const d = new Date(dateStr + 'T00:00:00Z');
  d.setUTCDate(d.getUTCDate() - (d.getUTCDay() + 6) % 7);
  return iso(d);
}

// 최근 n주의 주별 운동일수 (오래된 주부터)
function weekly(log, todayStr, n = 8) {
  const cur = new Date(monday(todayStr) + 'T00:00:00Z');
  return Array.from({ length: n }, (_, i) => {
    const d = new Date(cur);
    d.setUTCDate(d.getUTCDate() - 7 * (n - 1 - i));
    const start = iso(d);
    return { start, count: Object.keys(log).filter(k => hasSets(log[k]) && monday(k) === start).length };
  });
}

const series = (log, pick) => Object.keys(log).sort().map(d => [d, pick(log[d])]).filter(([, v]) => v > 0);

function plot(vals, w, h, pad, extra = []) {
  const all = vals.concat(extra);
  let lo = Math.min(...all), hi = Math.max(...all);
  if (lo === hi) { lo -= 1; hi += 1; }
  const y = v => pad + (h - 2 * pad) * (1 - (v - lo) / (hi - lo));
  return { y, pts: vals.map((v, i) => [vals.length > 1 ? pad + (w - 2 * pad) * i / (vals.length - 1) : w / 2, y(v)]) };
}

const valid = d => !!d && typeof d.log === 'object' && !!d.log && typeof d.routine === 'object' && !!d.routine;

// 3일 루틴(A·B·C)으로 저장된 예전 데이터: 종목과 기록은 그대로 두고 새 요일만 채운다
function migrate(d) {
  const old = !d.routine.D;
  for (const k of ORDER) {
    const def = DEFAULT_ROUTINE[k];
    if (!Array.isArray(d.routine[k]?.ex)) d.routine[k] = structuredClone(def);
    else if (old) Object.assign(d.routine[k], { name: def.name, focus: def.focus });
  }
  // 프로그램 도입 전 데이터: 휴식 값이 없으므로 8회 이하로 시작하는 종목을 다관절로 본다
  if (d.phase === undefined) for (const k of ORDER) for (const e of d.routine[k].ex) if (!e.rest && e.lo <= 8) e.rest = 120;
  return d;
}

      <button class="ok" aria-label="${n} ${i + 1}세트 완료">${CHECK}</button></div>`;
  }).join('');
  return `<section class="card" data-ex="${n}">
    <div class="between"><h3><button class="link" data-guide="${n}" aria-haspopup="dialog">${n}</button></h3><span class="tag">${esc(e.sets)} × ${esc(e.lo)}–${esc(e.hi)}</span></div>
    <p class="muted">${prev ? `지난번 ${esc(fmt(prev))}${feel ? ' · ' + esc(FEEL[feel] || '') : ''}${tip.up ? ' <b class="up">증량</b>' : note ? ` <span class="tag">${note}</span>` : ''}` : `처음 · ${esc(e.lo)}~${esc(e.hi)}회 할 수 있는 무게를 찾아 적으세요`}</p>
    ${rows}
    <div class="feel sm" role="group" aria-label="${n} 느낌">${[1, 2, 3, 4].map(f => `<button class="pill" data-xfeel="${f}" aria-pressed="${mine === f}">${FEEL[f]}</button>`).join('')}</div></section>`;
}

function refreshRing() { $('#ring').innerHTML = ring(app.querySelectorAll('.set.done').length, app.querySelectorAll('.set').length); }

// 횟수가 적힌 세트만 기록한다. 아무것도 없으면 그날 기록 자체를 지운다.
function collect() {
  const s = db.log[date] ||= {};
  s.sets ||= {};
  s.day = day;
  const w = parseFloat($('#bw').value), bf = parseFloat($('#bf').value);
  if (w > 0) s.weight = w; else delete s.weight;
  if (bf > 0 && bf < 70) s.bf = bf; else delete s.bf;
  if ($('#cardio').checked) s.cardio = true; else delete s.cardio;
  if (pickedFeel()) s.feel = pickedFeel(); else delete s.feel; // 느낌만으로는 기록을 남기지 않는다 (아래 삭제 조건)
  s.feels ||= {};
  for (const c of app.querySelectorAll('[data-ex]')) {
    const sets = [], xf = +c.querySelector('[data-xfeel][aria-pressed=true]')?.dataset.xfeel;
    for (const r of c.querySelectorAll('.set')) {
      const [kg, raw] = [...r.querySelectorAll('input')].map(i => Math.max(0, parseFloat(i.value) || 0)), reps = Math.round(raw);
      r.classList.toggle('done', reps > 0);
      if (reps > 0) sets.push([kg, reps]);
    }
    if (sets.length) s.sets[c.dataset.ex] = sets; else delete s.sets[c.dataset.ex];
    if (sets.length && xf) s.feels[c.dataset.ex] = xf; else delete s.feels[c.dataset.ex];
  }
  if (!Object.keys(s.feels).length) delete s.feels;
  if (!s.weight && !s.bf && !s.cardio && !hasSets(s)) delete db.log[date];
  save();
  refreshRing();
}

// figure.js를 아직 받지 못한 경우(업데이트 직후 오프라인)에도 안내 창은 열려야 한다
const hasFig = name => typeof FIG !== 'undefined' && !!FIG[name];
let figFrame;
function playFigure(name) {
  cancelAnimationFrame(figFrame);
  const box = $('#fig'), [pri, sec] = (MUSCLES[name] || ['', '']).map(x => x.split(' '));
  if (!box || !hasFig(name)) return;
  // 움직임을 줄이도록 설정한 기기에서는 시작 자세와 끝 자세를 나란히 보여 준다
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { box.innerHTML = figSvg(name, 0, pri, sec) + figSvg(name, 1, pri, sec); return; }
  box.innerHTML = figSvg(name, 0, pri, sec); // 첫 화면은 바로 그린다 (화면이 가려져 있으면 애니메이션 프레임이 오지 않는다)
  const t0 = performance.now();
  const step = now => { const ph = ((now - t0) / 2600) % 1; box.innerHTML = figSvg(name, (1 - Math.cos(ph * 2 * Math.PI)) / 2, pri, sec); figFrame = requestAnimationFrame(step); };
  figFrame = requestAnimationFrame(step);
}

// ---- GitHub 자동 백업 ----
// 기록(db)을 비공개 저장소의 gymlog.json 한 파일로 올린다. 날짜별 버전은 저장소의 커밋 기록에 남는다.
// 토큰과 연결 상태는 db와 다른 키에 두어 내보내기 파일에 섞이지 않게 한다.
function queueSync() { clearTimeout(syncTimer); syncTimer = setTimeout(push, 20000); }
const gh = (path, opt = {}, accept = 'application/vnd.github+json') => fetch(`https://api.github.com/repos/${sync.repo}${path}`, { ...opt, headers: { Authorization: `Bearer ${sync.token}`, Accept: accept, 'X-GitHub-Api-Version': '2022-11-28' } });

async function remoteFile() { // { sha, data } 또는 파일이 없으면 null
  const r = await gh('/contents/' + SYNC_FILE);
  if (r.status === 404) return null;
  if (!r.ok) throw new Error('GitHub 응답 ' + r.status);
  const j = await r.json();
  // 1MB를 넘는 파일은 content가 비어 오므로 원문을 따로 받는다
  const text = j.content ? unb64(j.content) : await (await gh('/contents/' + SYNC_FILE, {}, 'application/vnd.github.raw+json')).text();
  return { sha: j.sha, data: JSON.parse(text) };
}

async function push() {
  if (!sync.linked || sync.stuck || syncing || !sync.dirty) return;
  syncing = true;
  sync.dirty = false; // 올리는 동안 생긴 변경은 save()가 다시 표시한다
  try {
    const r = await gh('/contents/' + SYNC_FILE, { method: 'PUT', body: JSON.stringify({ message: 'backup ' + today(), content: b64(JSON.stringify(db)), ...(sync.sha ? { sha: sync.sha } : {}) }) });
    if (r.ok) { sync.sha = (await r.json()).content.sha; sync.at = Date.now(); delete sync.error; }
    else {
      sync.dirty = true; sync.stuck = true; // 덮어쓰지 않고 멈춘다. 설정에서 다시 연결해 풀어야 한다.
      sync.error = r.status === 409 || r.status === 422 ? 'GitHub의 백업이 다른 기기에서 바뀌었습니다. 연결을 다시 눌러 불러올지 덮어쓸지 고르세요.'
        : r.status === 401 || r.status === 403 ? '토큰이 만료됐거나 권한이 없습니다. 새 토큰으로 다시 연결하세요.' : `올리기 실패 (${r.status}). 다시 연결해 보세요.`;
    }
  } catch { sync.dirty = true; sync.error = '인터넷 연결이 없어 올리지 못했습니다. 연결되면 다시 시도합니다.'; }
  syncing = false; saveSync(); showSync();
  if (sync.dirty && !sync.stuck && !sync.error) queueSync();
}

async function connectSync(repo, token) {
  const prev = sync;
  try {
    if (!REPO_RE.test(repo)) throw new Error('저장소는 계정이름/저장소이름 형식으로 적습니다.');
    if (!token && !(prev.token && prev.repo === repo)) throw new Error('토큰을 입력하세요.');
    sync = { repo, token: token || prev.token };
    const info = await gh('');
    if (info.status === 401) throw new Error('토큰이 올바르지 않거나 만료됐습니다.');
    if (info.status === 404) throw new Error('저장소를 찾을 수 없습니다. 이름과 토큰의 저장소 권한을 확인하세요.');
    if (!info.ok) throw new Error('GitHub 응답 ' + info.status);
    if (!(await info.json()).private) throw new Error('공개 저장소입니다. 건강 기록은 비공개 저장소에만 올립니다.');
    const remote = await remoteFile(), mine = Object.keys(db.log).length;
    if (remote) {
      if (!valid(remote.data)) throw new Error('저장소의 gymlog.json이 이 앱의 백업이 아닙니다.');
      sync.sha = remote.sha;
      if (confirm(`GitHub 백업에 ${Object.keys(remote.data.log).length}일치 기록이 있습니다. 이 기기에는 ${mine}일치가 있습니다.\n\n[확인] GitHub의 기록을 이 기기로 불러옵니다.\n[취소] 불러오지 않습니다.`)) {
        db = migrate(remote.data); localStorage.setItem(KEY, JSON.stringify(db)); day = null; sync.at = Date.now();
      } else if (confirm('그러면 이 기기의 기록으로 GitHub 백업을 덮어쓸까요?')) sync.dirty = true;
      else throw new Error('연결을 취소했습니다.');
    } else sync.dirty = true;
    sync.linked = true; saveSync();
    await push();
  } catch (e) { if (!sync.linked) sync = prev; throw e; }
}

function syncText() {
  if (!sync.linked) return '연결되지 않았습니다.';
  if (sync.error) return sync.error;
  return (sync.at ? '마지막 백업 ' + new Date(sync.at).toLocaleString('ko-KR') : '아직 올린 적이 없습니다.') + (sync.dirty ? ' · 올릴 변경이 있습니다.' : '');
}
function showSync() { const el = $('#syncStatus'); if (el) el.textContent = syncText(); }
document.addEventListener('visibilitychange', () => document.hidden && push()); // 앱을 닫거나 화면을 끌 때 바로 올린다
addEventListener('online', push);

// ---- 휴식 타이머 ----
let restEnd = 0, restTotal = 0, restTick, audio;
const restFor = row => db.routine[day]?.ex.find(e => e.n === row.closest('[data-ex]').dataset.ex)?.rest || db.rest || 90;
function startRest(sec) {
  try { audio ||= new AudioContext(); audio.resume(); } catch {} // 소리는 터치 직후에만 허용되므로 여기서 깨운다
  restTotal = sec; restEnd = Date.now() + sec * 1000;
  clearInterval(restTick); restTick = setInterval(tickRest, 250);
  tickRest();
}
function tickRest() {
  const left = Math.ceil((restEnd - Date.now()) / 1000), bar = $('#rest');
  if (left <= 0) {
    clearInterval(restTick); bar.hidden = true;
    if (restEnd) { restEnd = 0; navigator.vibrate?.([200, 100, 200]); beep(); }
    return;
  }
  bar.hidden = false; $('#restTime').textContent = clock(left); bar.style.setProperty('--p', left / restTotal);
}
function beep() {
  try { const o = audio.createOscillator(), g = audio.createGain(); o.frequency.value = 880; g.gain.value = .15; o.connect(g).connect(audio.destination); o.start(); o.stop(audio.currentTime + .35); } catch {}
}

function exportData() {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(db, null, 1)], { type: 'application/json' }));
  a.download = `gymlog-${today()}.json`;
  a.click();
}

async function importData(file) {
  try {
    const d = JSON.parse(await file.text());
    if (!valid(d)) throw new Error('이 앱의 백업 파일이 아닙니다.');
    if (!confirm(`${Object.keys(d.log).length}일치 기록을 불러옵니다. 현재 기록은 덮어씁니다.`)) return;
    db = migrate(d); save(); day = null; show('history');
  } catch (e) { alert('가져오기 실패: ' + e.message); }
}

app.addEventListener('input', e => {
  const t = e.target;
  if (view === 'today' && t.id !== 'date') collect();
  else if (t.id === 'goal') { const g = parseFloat(t.value); if (g > 0) db.goal = g; else delete db.goal; save(); }
});
app.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'date') { date = t.value || today(); day = null; renderToday(); }
  else if (t.id === 'import' && t.files[0]) importData(t.files[0]);
  else if (t.id === 'restSec') { db.rest = +t.value; save(); }
  else if (t.id === 'exsel') { exSel = t.value; renderProgress(); }
  else if (t.id === 'start') { if (t.value) db.start = t.value; else delete db.start; save(); }
  else if (t.classList.contains('reps') && t.value > 0 && date === today()) startRest(restFor(t));
});
document.addEventListener('click', e => {
  const t = e.target.closest('button');
  if (!t) return;
  if (t.dataset.guide) openGuide(t.dataset.guide);
  else if ('close' in t.dataset) $('#guide').close();
  else if (t.dataset.view) show(t.dataset.view);
  else if (t.dataset.day) { day = t.dataset.day; if (db.log[date]) { db.log[date].day = day; save(); } renderToday(); }
  else if (t.dataset.feel || t.dataset.xfeel) { // 같은 버튼을 다시 누르면 선택 해제
    const on = t.getAttribute('aria-pressed') === 'true';
    t.parentNode.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b === t && !on));
    collect(); refreshAdvice();
  }
  else if (t.classList.contains('ok')) {
    const row = t.closest('.set');
    row.querySelectorAll('input').forEach(i => i.value ||= i.placeholder);
    collect();
    if (row.classList.contains('done') && date === today()) startRest(restFor(row));
  }
  else if (t.id === 'applyPhase') { const ph = phaseAt(nowWeek()); db.routine = applyPhase(db.routine, PHASES[ph]); db.phase = ph; save(); renderToday(); }
  else if (t.id === 'saveRoutine') { for (const k of ORDER) db.routine[k].ex = parseRoutine($('#r' + k).value); save(); renderSettings(); $('#saveRoutine').textContent = '저장됨'; }
  else if (t.id === 'resetRoutine') {
    if (!confirm('종목을 기본 루틴으로 바꿉니다. 운동 기록은 그대로 남지만, 직접 고친 종목 구성은 사라집니다.')) return;
    const ph = phaseAt(nowWeek()); db.routine = applyPhase(DEFAULT_ROUTINE, PHASES[ph]); db.phase = ph; save(); renderSettings();
  }
  else if (t.id === 'syncConnect') {
    t.disabled = true; $('#syncStatus').textContent = '연결하는 중...';
    connectSync($('#syncRepo').value.trim(), $('#syncToken').value.trim()).then(() => renderSettings(), e => { renderSettings(); $('#syncStatus').textContent = e.message; });
  }
  else if (t.id === 'syncNow') { sync.dirty = true; $('#syncStatus').textContent = '올리는 중...'; push(); }
  else if (t.id === 'syncOff') { if (confirm('이 기기에서 연결을 해제합니다. GitHub에 올라간 백업은 그대로 남습니다.')) { sync = {}; saveSync(); renderSettings(); } }
  else if (t.id === 'export') exportData();
  else if (t.id === 'restAdd') { restEnd += 30000; restTotal += 30; tickRest(); }
  else if (t.id === 'restSub') { restEnd -= 30000; if (restEnd <= Date.now()) restEnd = 0; tickRest(); } // 남은 시간이 30초 이하면 알림 없이 끝낸다
  else if (t.id === 'restSkip') { restEnd = 0; tickRest(); }
});

function selfTest() {
  const e = ex('x', 3, 8, 12), j = JSON.stringify, fails = [];
  const eq = (name, a, b) => j(a) === j(b) || fails.push(`${name}: ${j(a)} != ${j(b)}`);
  eq('no prev', suggest(null, e), null);
  eq('add rep, capped', suggest([[40, 12], [40, 10], [40, 12]], e), { up: false, mode: 'add', sets: [[40, 12], [40, 11], [40, 12]] });
  eq('add weight', suggest([[40, 12], [40, 12], [40, 13]], e), { up: true, mode: 'up', sets: [[42.5, 8], [42.5, 8], [42.5, 8]] });
  const same = k => [[k, 10], [k, 10], [k, 10]];
  eq('easy ups one rep early', suggest([[40, 11], [40, 11], [40, 11]], e, 1).mode, 'up');
  eq('easy adds two reps', suggest(same(40), e, 1).sets, [[40, 12], [40, 12], [40, 12]]);
  eq('hard repeats even at top', suggest([[40, 12], [40, 12], [40, 12]], e, 3), { up: false, mode: 'hold', sets: [[40, 12], [40, 12], [40, 12]] });
  eq('too much deloads 10%', suggest(same(40), e, 4), { up: false, mode: 'deload', sets: same(35) });
  eq('advice differs per case', new Set([advice(1, 0), advice(1, 1), advice(2, 0), advice(3, 0), advice(3, 3), advice(4, 0)]).size, 6);
  eq('exercise feel beats session feel', [feelFor({ feel: 3, feels: { x: 1 } }, 'x'), feelFor({ feel: 3, feels: { x: 1 } }, 'y'), feelFor({}, 'x'), feelFor(undefined, 'x')], [1, 3, 0, 0]);
  eq('last feel', [lastFeel({ '2026-01-01': { day: 'A', feel: 3, sets: { x: [[1, 1]] } }, '2026-01-02': { feel: 1, sets: {} } }, '2026-01-03'), lastFeel({}, '2026-01-03')], [3, 0]);
  eq('short session never ups', suggest([[40, 12]], e).up, false);
  const log = { '2026-11-16': { day: 'F', sets: { x: [[1, 1]] } }, '2026-11-23': { day: 'A', sets: { x: [[1, 1]] } }, '2026-11-24': { day: 'C', sets: { x: [[2, 2]] } }, '2026-11-25': { day: 'A', weight: 80, sets: {} } };
  eq('rotation continues, skips weigh-in', nextDay(log, '2026-11-26'), 'D');
  eq('rotation wraps', nextDay(log, '2026-11-17'), 'A');
  eq('first day', nextDay({}, '2026-01-01'), 'A');
  eq('prev excludes same day', prevSets(log, '2026-11-24', 'x'), [[1, 1]]);
  eq('routine parse', parseRoutine('스쿼트, 4, 5, 3\n\n컬\n프레스, 3, 8, 12, 120'), [ex('스쿼트', 4, 5, 5), ex('컬'), ex('프레스', 3, 8, 12, 120)]);
  const names = Object.values(DEFAULT_ROUTINE).flatMap(d => d.ex.map(x => x.n));
  eq('every default exercise has a guide', names.filter(n => !(GUIDES[n]?.length === 5 && GUIDES[n].slice(1, 4).every(a => a.length) && GUIDES[n][4].every(([, u]) => u.startsWith('https://')))), []);
  eq('every default exercise has known muscles', names.filter(n => !(MUSCLES[n] && MUSCLES[n][0] && MUSCLES[n].join(' ').split(' ').filter(Boolean).every(k => MUSCLE_NAMES[k]))), []);
  const bad = names.filter(n => { if (!FIG[n]) return true; const [p, q] = MUSCLES[n].map(x => x.split(' ')); return [0, .5, 1].some(t => { const svg = figSvg(n, t, p, q); return !svg.includes('class="mu on"') || /NaN|undefined/.test(svg); }); });
  eq('every default exercise draws a figure with its main muscle', bad, []);
  eq('ik reaches the target and clamps when too far', [ik([0, 0], [30, 40], 30, 30, 1)[1].map(Math.round), ik([0, 0], [300, 0], 30, 30, 1)[1].map(Math.round)], [[30, 40], [60, 0]]);
  eq('program is 156 weeks', PHASES.reduce((n, p) => n + p.weeks, 0), 156);
  eq('week of', [weekOf('2026-11-23', '2026-11-23'), weekOf('2026-11-23', '2026-11-29'), weekOf('2026-11-23', '2026-11-30'), weekOf('2026-11-23', '2026-11-01')], [1, 1, 2, 1]);
  eq('phase at', [1, 4, 5, 16, 17, 19, 31, 33, 52, 53, 76, 77, 85, 87, 124, 125, 137, 139, 156, 300].map(phaseAt), [0, 0, 1, 1, 2, 3, 4, 5, 5, 6, 6, 7, 8, 9, 9, 10, 11, 12, 12, 12]);
  const base = { A: { name: 'a', ex: [ex('p', 3, 8, 12, 120), ex('q', 3, 8, 12, 120), ex('r', 3, 10, 15)] } }, grown = applyPhase(base, PHASES[5]);
  eq('phase sets and ranges', grown.A.ex.map(x => [x.n, x.sets, x.lo, x.hi]), [['p', 4, 8, 12], ['q', 4, 8, 12], ['r', 3, 10, 15]]);
  eq('phase leaves source untouched', [base.A.ex[0].sets, applyPhase(base, PHASES[0]).A.ex.map(x => [x.sets, x.lo, x.hi])], [3, [[2, 10, 15], [2, 10, 15], [2, 12, 20]]]);
  eq('valid', [valid({ log: {}, routine: {} }), valid({ log: {} }), valid(null)], [true, false, false]);
  eq('e1rm', [e1rm(100, 10), best([[40, 12], [50, 6]]), best([[0, 15], [0, 12]]), best(undefined)], [133.3, 60, 15, 0]);
  eq('goal weight', goalWeight(80, 20), 73.6);
  const long = '한글 gymlog '.repeat(9000);
  eq('base64 roundtrip', [unb64(b64('체중 70kg')), unb64(b64(long)) === long, unb64('7ZWc\n6riA')], ['체중 70kg', true, '한글']);
  eq('repo format', ['a/b', 'me/gym-log.data', 'a', 'a/b/c', 'a b/c', ''].map(x => REPO_RE.test(x)), [true, true, false, false, false, false]);
  eq('clock', [clock(90), clock(5)], ['1:30', '0:05']);
  eq('monday', [monday('2026-11-23'), monday('2026-11-29'), monday('2026-11-30')], ['2026-11-23', '2026-11-23', '2026-11-30']);
  eq('weekly', weekly(log, '2026-11-25', 2), [{ start: '2026-11-16', count: 1 }, { start: '2026-11-23', count: 2 }]);
  eq('series', series(log, s => s.weight), [['2026-11-25', 80]]);
  eq('plot', [plot([1, 3], 100, 50, 10).pts, plot([5], 100, 50, 10).pts], [[[10, 40], [90, 10]], [[50, 25]]]);
  const old = migrate({ log: {}, routine: { A: { name: '옛 이름', ex: [ex('a')] }, B: { name: 'b', ex: [] }, C: { name: 'c', ex: [] } } });
  eq('migrate keeps exercises, adds days, marks compounds', [old.routine.A.ex[0].n, old.routine.A.name, old.routine.F.ex.length, migrate(old).routine.A.ex.length, old.routine.A.ex[0].rest], ['a', '밀기 1', 5, 1, 120]);
  app.textContent = fails.length ? 'FAIL\n' + fails.join('\n') : 'self-test OK';
}

if (location.hash === '#test') selfTest(); else show('today');
navigator.storage?.persist?.();
if (sync.linked && sync.dirty) push();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
